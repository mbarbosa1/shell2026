[env:s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = madhephaestus/ESP32Servo
monitor_speed = 115200
; Serial Monitor: show what you type, and send the whole line when you press Enter
; (needed for the servo test commands in main.cpp).
monitor_echo = yes
monitor_filters = send_on_enter

